/* Layout. First stop: the risk map fills the screen and a white panel on the right asks for two choices (the poll).
   After sending, the map zooms out into the centre circle of the hub: three bright fields from the palette (sky, banana,
   pink), two above and one across the bottom, framed in navy. Choosing one grows the field's colour out of the centre,
   then the room picker arrives. */
:root{
  color-scheme:light;
  --navy:#1C3150; --abyss:#263F60; --sea:#5878A0; --ink:#0A0A0A; --cream:#FDFCF3;
  --sky:#C0E8F8; --banana:#F0E060; --purple:#B868C0; --mustard:#E0C060; --red:#E06050;
  --display:"Adelphe", Georgia, "Times New Roman", serif;
  --body:"BBB Poppins TN", "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --d:clamp(220px, 30vmin, 340px); --r:calc(var(--d) / 2);
  --pad:clamp(24px, 3.6vw, 60px);
  --hh:88px;
}
html,body{height:100%}
#root{min-height:100%;display:flex;flex-direction:column}
body{background:var(--navy);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.dot{flex:none;display:inline-block;width:.85rem;height:.85rem;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px rgba(10,10,10,.55)}

/* ---------- header: one dark-blue bar with the page's title ---------- */
.top{flex:none;display:flex;align-items:center;min-height:var(--hh);background:var(--navy);color:#fff;
  padding-block:14px;padding-left:max(var(--pad), env(safe-area-inset-left,0px));padding-right:max(var(--pad), env(safe-area-inset-right,0px))}
.top h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(28px,1rem + 1.4vw,42px);line-height:1;letter-spacing:-.005em}

/* ---------- the poll: the risk map, and a white panel that stays beside it ---------- */
.poll{display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,30vw,460px);height:calc(100vh - var(--hh));height:calc(100dvh - var(--hh));min-height:600px;background:var(--navy)}
.poll.fly{position:fixed;left:0;right:0;bottom:0;height:auto;min-height:0;z-index:30;background:transparent;overflow:hidden;pointer-events:none}
.pmap{position:relative;overflow:hidden;min-width:0;background:linear-gradient(180deg,#5878A0 0%,#33507A 38%,#1C3150 100%)}
.pmap .glow{position:absolute;left:-20%;right:-20%;top:-35%;height:80%;pointer-events:none;background:radial-gradient(ellipse at 28% 0%,rgba(192,232,248,.24),transparent 62%)}
.mcap{position:absolute;z-index:3;left:max(var(--pad), env(safe-area-inset-left,0px));top:22px;right:16px;display:flex;flex-direction:column;gap:6px;color:#fff;pointer-events:none}
.mcap .eb{font-size:.78rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--sky)}
.mcap .hw{display:flex;gap:12px;align-items:baseline;font-weight:700;font-size:clamp(1.2rem,1rem + .55vw,1.5rem);line-height:1.35;max-width:46ch;text-shadow:0 1px 10px rgba(10,20,40,.35)}
.mcap .hw::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--mustard);box-shadow:0 0 0 4px rgba(224,192,96,.3);transform:translateY(-1px)}
#teth{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#teth path{fill:none;stroke:var(--c);stroke-width:1.6;stroke-linecap:round;opacity:.8;transition:opacity .3s}
#nodes{position:absolute;inset:0}
.mh,.ms{position:absolute;left:0;top:0;border:0;padding:0;margin:0;border-radius:50%;background:var(--c);color:var(--ink);cursor:pointer;
  transition:opacity .3s,box-shadow .3s}
.mh{display:flex;align-items:center;justify-content:center;text-align:center}
.mh .hn{font-family:var(--display);font-weight:400;font-size:var(--hf,16px);line-height:1.08;max-width:76%;text-wrap:balance}
.mh[data-c=data],.ms[data-c=data]{box-shadow:inset 0 0 0 1.5px #8094A6}
.ms{display:grid;place-items:center;z-index:2}
.ms::before{content:"";position:absolute;inset:-8px;border-radius:50%}
.ms .tk{width:58%;height:58%;opacity:0;transition:opacity .25s}
.mh .badge{position:absolute;top:3%;right:3%;width:28%;max-width:34px;aspect-ratio:1;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;
  opacity:0;transform:scale(.5);transition:opacity .25s,transform .3s;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.mh .badge .tk{width:62%;height:62%}
.mh.hot,.ms.hot{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 32%,transparent)}
.ms.aim{box-shadow:0 0 0 4px #fff,0 0 0 10px color-mix(in srgb,var(--c) 35%,transparent)}
.mh.on,.ms.on{box-shadow:0 0 0 4px #fff,0 0 0 10px color-mix(in srgb,var(--c) 40%,transparent)}
.ms.on .tk{opacity:1}
.mh.on .badge{opacity:1;transform:none}
.pmap[data-hot] .mh:not(.hot),.pmap[data-hot] .ms:not(.hot){opacity:.32}
.pmap[data-hot] #teth path:not(.hot){opacity:.12}
.mh:focus-visible,.ms:focus-visible{outline:3px solid #fff;outline-offset:5px}

/* the card that tells you about a circle */
.card{position:absolute;z-index:5;left:0;top:0;width:min(330px,calc(100% - 24px));background:#fff;color:var(--ink);border-radius:16px;padding:16px 18px;
  box-shadow:0 18px 50px -18px rgba(0,0,0,.65);display:flex;flex-direction:column;gap:8px}
.card .ce{display:flex;align-items:center;gap:8px;font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#3A474D;padding-right:30px}
.card h3{margin:0;font-family:var(--display);font-weight:600;font-size:1.32rem;line-height:1.15;text-wrap:balance}
.card p{margin:0;font-size:.95rem;line-height:1.45;color:#26313C}
.card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.95rem;line-height:1.35}
.card li{display:flex;gap:9px;align-items:baseline}
.card .ca{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-top:4px}
.cb{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:.5rem 1.05rem;font-weight:700;font-size:.92rem;cursor:pointer}
.cb:hover{background:var(--ink);color:#fff}
.cb.lite{border-width:1.5px;padding:.35rem .85rem;font-size:.85rem}
.cs{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.cs .tk{width:1.1em;height:1.1em}
.cn{font-weight:700;color:#8A2B1F}
.cx{position:absolute;top:8px;right:8px;width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;border-radius:50%;cursor:pointer;color:#3A474D}
.cx:hover{background:#F0F3F5}
.cx svg{width:16px;height:16px}
.card.dock{left:12px;right:12px;top:auto;bottom:12px;width:auto}
.card.peek{pointer-events:none}
.card.peek .cx{display:none}
.card .ch{margin:0;font-size:.9rem;font-weight:700;color:#3A474D;display:flex;align-items:center;gap:6px}
.card .ch .tk{width:1.1em;height:1.1em;flex:none}
.card.dock.dtop{top:12px;bottom:auto}

/* the white panel */
.side{position:sticky;top:0;height:calc(100vh - var(--hh));height:calc(100dvh - var(--hh));min-height:600px;display:flex;flex-direction:column;background:#fff;color:var(--ink);min-width:0;
  box-shadow:-18px 0 40px -30px rgba(0,0,0,.6)}
.sbody{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:clamp(22px,2.2vw,34px) clamp(20px,2vw,32px) 22px;display:flex;flex-direction:column;gap:22px}
.lead{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(1.35rem,1rem + .75vw,1.8rem);line-height:1.18;text-wrap:pretty}
.fld{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.ql{display:block;padding:0;font-weight:700;font-size:1.05rem;line-height:1.3}
.qh{margin:-4px 0 0;font-size:.92rem;color:#4A4A4A}
#pname{font:inherit;font-size:1.05rem;padding:.7rem .85rem;border:2px solid rgba(10,10,10,.32);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
#pname:focus{outline:3px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;padding:.55rem .75rem;border:1.5px solid rgba(10,10,10,.16);border-radius:10px;cursor:pointer;font-size:.98rem;line-height:1.3;background:#fff;transition:background .2s,border-color .2s,opacity .2s}
.opt input{flex:none;width:22px;height:22px;margin:0;accent-color:#0A0A0A;cursor:pointer}
.opt:hover,.opt.hot{border-color:rgba(10,10,10,.55)}
.opt.on{background:color-mix(in srgb,var(--c) 30%,#fff);border-color:var(--ink)}
.opt.full{opacity:.55}
.max,.err{margin:0;font-weight:700;color:#8A2B1F;font-size:.95rem}
.sfoot{flex:none;padding:14px clamp(20px,2vw,32px) 18px;border-top:1px solid rgba(10,10,10,.12);background:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.send{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;border:0;border-radius:999px;background:#0A0A0A;color:#fff;font-weight:700;font-size:1.08rem;padding:.85rem 1.6rem;cursor:pointer}
.send:hover{background:#2C2C2C}
.send svg{width:1.05em;height:1.05em}
.send[disabled]{opacity:.6;cursor:progress}
/* 24 Oct: 'I've already chosen' sits beside Send my choices, quieter: white with an outline */
.sbtns{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.chosen{display:inline-flex;align-items:center;justify-content:center;border:2px solid #0A0A0A;border-radius:999px;background:#fff;color:#0A0A0A;font-weight:600;font-size:1rem;padding:calc(.85rem - 2px) 1.4rem;cursor:pointer}
.chosen:hover{background:#F2F2F2}
.skip2,.lnk{align-self:flex-start;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.skip2{font-size:.9rem;color:#4A4A4A}
.lnk{font-weight:700;font-size:.98rem;color:var(--ink)}
.thanks .tkbig{width:56px;height:56px;border-radius:50%;background:#0A0A0A;color:#fff;display:grid;place-items:center}
.thanks .tkbig svg{width:30px;height:30px}
.thanks h2{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(1.9rem,1.3rem + 1.1vw,2.5rem);line-height:1.05;outline:none}
.thanks .tp{margin:-8px 0 0;font-size:1.02rem}
.sum h3{margin:0 0 8px;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#3A474D}
.sum ul{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:7px}
.sum li{display:flex;gap:10px;align-items:baseline;line-height:1.35}
.note{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:.86rem;color:#3A474D;background:#F2F8FB;border-radius:8px;padding:.55rem .75rem}
.note svg{flex:none;width:16px;height:16px;margin-top:2px}

/* ---------- the hub: instructions, then the three activities ---------- */
#hubv{flex:1 0 auto;display:flex;flex-direction:column}
.band{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 32px;background:#fff;color:var(--ink);
  padding-block:clamp(18px,2.2vw,28px);padding-left:max(var(--pad), env(safe-area-inset-left,0px));padding-right:max(var(--pad), env(safe-area-inset-right,0px))}
.band h2{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(2rem,1.2rem + 1.9vw,3.1rem);line-height:1.02;outline:none}
.band p{margin:.35rem 0 0;font-size:clamp(1rem,.92rem + .3vw,1.18rem);max-width:62ch;color:#262626}
.bk{display:inline-flex;align-items:center;gap:.45rem;background:none;border:0;padding:.3rem 0;font-weight:700;font-size:.95rem;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.bk svg{width:16px;height:16px}

/* each activity's colours: its field, the text on it, and a quieter second tone */
[data-k="iceberg"]{--f:var(--sky);--t:var(--navy);--t2:#2E4A6E}
[data-k="drivers"]{--f:var(--banana);--t:var(--ink);--t2:#3A3A2A}
[data-k="missing"]{--f:#E078B0;--t:var(--ink);--t2:#3A1028}

/* ---------- the board ---------- */
.board{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;gap:4px;flex:1 0 auto}
.act{position:relative;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:clamp(14px,2.2vh,26px);
  padding-block:clamp(22px,3.8vh,52px);padding-inline:var(--pad);background:var(--f);color:var(--t);border:0;text-align:left}
.act::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s ease;
  background:radial-gradient(110% 90% at var(--gx) var(--gy), rgba(255,255,255,.42), transparent 60%)}
.act:hover::before,.act:focus-visible::before,.act.lit::before{opacity:1}
.act:focus-visible{outline:none;box-shadow:inset 0 0 0 4px var(--t)}
.act[data-k="iceberg"]{--gx:0%;--gy:0%;grid-column:1;grid-row:1;padding-right:calc(var(--r) + 36px)}
.act[data-k="drivers"]{--gx:100%;--gy:0%;grid-column:2;grid-row:1;padding-left:calc(var(--r) + 36px);align-items:flex-end;text-align:right}
.act[data-k="missing"]{--gx:0%;--gy:100%;grid-column:1 / -1;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:calc(var(--d) + 72px);align-items:center}
.txt{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:clamp(14px,1.6vw,26px);align-items:start;max-width:34rem;min-width:0}
.act[data-k="drivers"] .txt{grid-template-columns:minmax(0,1fr) auto}
.act[data-k="drivers"] .num{grid-column:2;grid-row:1 / span 3}
.act[data-k="drivers"] .tt{grid-column:1;grid-row:1;align-items:flex-end}
.num{grid-row:1 / span 3;font-family:var(--display);font-weight:600;font-size:clamp(4.2rem,7.2vw,7.4rem);line-height:.78;color:var(--t);font-variant-numeric:lining-nums;padding-top:.04em}
.tt{display:flex;flex-direction:column;align-items:flex-start;gap:.55rem;min-width:0}
.an{font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t);line-height:1.2}
.act h2{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(1.9rem,3.2vw,3.1rem);line-height:1.02;text-wrap:balance}
.act p{margin:0;color:var(--t2);font-size:clamp(.98rem,1.08vw,1.1rem);max-width:34ch;text-wrap:pretty}
.cta{display:inline-flex;align-items:center;gap:.55rem;margin-top:.45rem;padding:.62rem 1.15rem;border-radius:999px;font-weight:700;font-size:.95rem;
  color:var(--t);border:2px solid var(--t);transition:background .35s,color .35s}
.cta svg{width:1em;height:1em;transition:transform .35s}
.act:hover .cta,.act:focus-visible .cta,.act.lit .cta{background:var(--t);color:var(--f)}
.act:hover .cta svg,.act:focus-visible .cta svg{transform:translateX(3px)}
.act .art{position:relative;display:block;height:clamp(150px,27vh,300px);width:auto;max-width:100%;aspect-ratio:6/5;margin-top:auto;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.act[data-k="missing"] .art{margin:0;justify-self:center;height:clamp(150px,25vh,280px)}
.act:hover .art,.act:focus-visible .art{transform:translateY(-5px) scale(1.02)}

/* Underlying drivers comes in two parts: Saturday, then Sunday */
.parts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin-top:.45rem}
.part{display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;min-width:12.5rem;padding:.75rem 1.05rem;border-radius:14px;border:2px solid var(--t);
  background:rgba(255,255,255,.38);color:var(--t);text-align:left;cursor:pointer;transition:background .3s,color .3s}
.part .pl{font-weight:700;font-size:1.02rem;line-height:1.2}
.part .pc{display:inline-flex;align-items:center;gap:.45rem;font-size:.9rem;font-weight:700}
.part .pc svg{width:1em;height:1em;flex:none}
.part:not(.off):hover,.part:not(.off):focus-visible{background:var(--t);color:var(--f)}
.part.off{border-style:dashed;border-color:rgba(58,58,42,.42);background:rgba(255,255,255,.14);color:rgba(58,58,42,.62);cursor:not-allowed}
.part.off .pc{font-weight:600}

/* ---------- the risk map in the middle ---------- */
.core{grid-column:1 / -1;grid-row:2;align-self:start;justify-self:center;width:var(--d);aspect-ratio:1;transform:translateY(-50%);z-index:3;pointer-events:none;position:relative}
.core .band2{position:absolute;inset:0;border-radius:50%;background:var(--navy);box-shadow:0 22px 50px -24px rgba(10,10,10,.55)}
.core .disc{position:absolute;inset:7%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#34557F,var(--navy) 72%);overflow:hidden}
.core svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring path{fill:none;stroke-linecap:round;stroke-width:2.4;opacity:.55;transition:opacity .45s,stroke-width .45s}
.ring path.on{opacity:1;stroke-width:5}
.map .teth{fill:none;stroke-width:.9;opacity:.8}
.map .drift{animation:drift 9s ease-in-out infinite alternate}
.map .drift:nth-child(2n){animation-duration:11s;animation-delay:-3s}
.map .drift:nth-child(3n){animation-duration:13s;animation-delay:-6s}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(1.2px,-1.6px)}}
.core .cap{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);white-space:nowrap;opacity:.85}

/* ---------- the zoom: the field's colour grows out of the centre ---------- */
.ov{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--f);color:var(--t);
  clip-path:circle(var(--or,0px) at var(--ox,50%) var(--oy,50%));transition:clip-path .75s cubic-bezier(.7,0,.25,1)}
.ov.open{clip-path:circle(var(--far,150vmax) at var(--ox,50%) var(--oy,50%))}
.ov-in{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center;gap:clamp(24px,4vw,72px);
  padding-block:calc(env(safe-area-inset-top,0px) + 76px) calc(env(safe-area-inset-bottom,0px) + 48px);
  padding-left:max(var(--pad), env(safe-area-inset-left,0px));padding-right:max(var(--pad), env(safe-area-inset-right,0px))}
.back{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:max(var(--pad), env(safe-area-inset-left,0px));display:inline-flex;align-items:center;gap:.5rem;
  background:transparent;border:2px solid var(--t);border-radius:999px;padding:.45rem 1rem;font-weight:700;font-size:.9rem;cursor:pointer;color:var(--t)}
.back:hover{background:var(--t);color:var(--f)}
.ov .big{width:100%;max-width:600px;justify-self:center;aspect-ratio:6/5;height:auto;transform:scale(.35);opacity:0;transition:transform .9s cubic-bezier(.2,.75,.2,1) .15s,opacity .5s ease .15s}
.ov.open .big{transform:scale(1);opacity:1}
.pick{display:flex;flex-direction:column;gap:1rem;min-width:0;max-width:36rem;opacity:0;transform:translateY(14px);transition:opacity .5s ease .55s,transform .6s ease .55s}
.ov.open .pick{opacity:1;transform:none}
.pick .name{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .6rem;font-size:.78rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--t)}
.pick .name b{font-family:var(--display);font-size:1.6rem;letter-spacing:0;line-height:1}
.pick h2{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(2rem,3.4vw,3.2rem);line-height:1.04;text-wrap:balance}
.pick p{margin:0;color:var(--t2);max-width:44ch}
.groups{display:flex;flex-direction:column;gap:.55rem;margin-top:.3rem}
.grp{display:grid;grid-template-columns:minmax(0,11.5rem) 1fr;align-items:center;gap:.4rem 1rem}
.grp .gl{display:flex;align-items:center;gap:.55rem;font-size:.86rem;font-weight:700;color:var(--t);min-width:0}
.grp .dot,.cl .dot{box-shadow:0 0 0 1.5px var(--t)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{width:2.7rem;height:2.7rem;border-radius:50%;border:2px solid var(--t);background:rgba(255,255,255,.35);font-weight:700;font-size:.98rem;cursor:pointer;color:var(--t);
  font-variant-numeric:tabular-nums;transition:background .25s,color .25s,transform .25s}
.chip:hover{background:rgba(255,255,255,.75)}
.chip[aria-pressed="true"]{background:var(--t);color:var(--f);transform:scale(1.08)}
.clus{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.6rem;margin-top:.3rem}
.cl{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-radius:14px;border:2px solid transparent;background:var(--cream);color:var(--ink);cursor:pointer;text-align:left;transition:border-color .25s,transform .25s}
.cl .dot{width:1.5rem;height:1.5rem}
.cl b{display:block;font-weight:700;font-size:.96rem;line-height:1.2}
.cl small{display:block;color:#4A4A4A;font-size:.8rem}
.cl:hover{border-color:var(--t)}
.cl[aria-pressed="true"]{border-color:var(--t);box-shadow:inset 0 0 0 2px var(--t);transform:translateY(-2px)}
.said{min-height:3.1em;font-size:1rem;border-left:4px solid var(--t);padding-left:.85rem}
.said .mut{color:var(--t2)}
.gorow{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem 1.4rem}
.go{display:inline-flex;align-items:center;gap:.6rem;padding:.85rem 1.45rem;border-radius:999px;background:var(--t);color:var(--f);font-weight:700;text-decoration:none;font-size:1.02rem}
.go svg{width:1.05em;height:1.05em}
.go[aria-disabled="true"]{background:transparent;color:var(--t2);border:2px dashed var(--t2);pointer-events:none}
.skip{color:var(--t);font-size:.9rem;text-underline-offset:3px}
.addr{font-size:.82rem;color:var(--t2);word-break:break-all}

/* ---------- editing this page's text (organisers only) ---------- */
#edbar{position:fixed;left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:40;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;max-width:calc(100vw - 32px)}
#edtoggle{border:0;border-radius:999px;padding:.5rem 1rem;font-weight:700;font-size:.85rem;cursor:pointer;background:var(--navy);color:var(--cream);box-shadow:0 6px 18px -8px rgba(0,0,0,.6)}
#edtoggle[aria-pressed="true"]{background:var(--ink);color:var(--banana)}
#edstatus,#edtip{font-size:.8rem;background:var(--navy);color:var(--cream);padding:.35rem .7rem;border-radius:8px}
.editmode [data-copy]{outline:2px dashed var(--ink);outline-offset:3px;cursor:text}
.editmode .pmap [data-copy],.editmode .top [data-copy]{outline-color:#fff}
.editmode [data-copy]:hover{background:rgba(255,255,255,.45)}
.edit-only{display:none}
.editmode .edit-only{display:block}
#ed{position:fixed;z-index:50;background:var(--cream);color:var(--navy);border-radius:12px;padding:12px;box-shadow:0 18px 48px -12px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:8px}
#ed textarea{width:100%;font:15px/1.45 var(--body);color:var(--navy);background:#fff;border:1.5px solid var(--sea);border-radius:8px;padding:8px 10px;resize:vertical}
#ed .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#ed button{border:0;border-radius:999px;padding:.4rem .9rem;font-weight:700;font-size:.85rem;cursor:pointer;background:var(--navy);color:var(--cream)}
#ed button.lite{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
#edhint{font-size:.8rem;color:var(--abyss)}

/* ---------- narrow screens: the map on top and the panel below it; the hub's three fields stacked ---------- */
@media (max-width:899px){
  :root{--d:min(62vw,280px);--hh:68px}
  .top{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  .poll{grid-template-columns:minmax(0,1fr);height:auto;min-height:0}
  .pmap{height:clamp(500px,148vw,680px)}
  .mcap{left:16px;top:16px}
  .side{position:relative;height:auto;min-height:0;box-shadow:none}
  .sbody{overflow:visible;padding:26px 16px 18px}
  .sfoot{position:sticky;bottom:0;z-index:2;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 24px -20px rgba(0,0,0,.45)}
  .sfoot .send{width:100%;font-size:1rem;padding-inline:1rem}
  .sbtns{width:100%;flex-direction:column;align-items:stretch}
  .sfoot .chosen{width:100%;font-size:.95rem}
  .band{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  .board{grid-template-columns:1fr;grid-template-rows:auto;min-height:0}
  .board::before{content:"";grid-column:1;grid-row:1;background:var(--navy)}
  .core{grid-column:1;grid-row:1;transform:none;margin-block:24px 28px}
  .act[data-k],.act[data-k="drivers"],.act[data-k="missing"]{grid-column:1;grid-row:auto;display:flex;flex-direction:column;align-items:flex-start;text-align:left;
    gap:22px;padding-block:32px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  .act[data-k="drivers"] .txt{grid-template-columns:auto minmax(0,1fr)}
  .act[data-k="drivers"] .num{grid-column:1}
  .act[data-k="drivers"] .tt{grid-column:2;align-items:flex-start}
  .parts{justify-content:flex-start;width:100%}
  .part{flex:1 1 11rem;min-width:0}
  .act .art,.act[data-k="missing"] .art{height:auto;width:min(100%,340px);margin:0;align-self:center;justify-self:auto}
  .ov-in{grid-template-columns:1fr;align-items:start}
  .ov .big{max-width:min(380px,80vw)}
  .grp{grid-template-columns:1fr}
}

/* ---------- the full risk map to read (opened from the hub's centre): the same map, a reading panel beside it ---------- */
.mback{pointer-events:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:.55rem;border:0;border-radius:999px;background:#fff;color:var(--ink);font-weight:700;font-size:1rem;
  padding:.62rem 1.15rem .62rem .95rem;cursor:pointer;box-shadow:0 8px 24px -10px rgba(0,0,0,.6);margin-bottom:6px}
.mback svg{width:1.05em;height:1.05em}
.mback:hover{background:var(--banana)}
.poll:not(.read) .mback{display:none}
.poll.read .mh.on,.poll.read .ms.on{box-shadow:none}
.poll.read .ms.on .tk,.poll.read .mh.on .badge{opacity:0}
.poll.read .mh.sel,.poll.read .ms.sel{box-shadow:0 0 0 4px #fff,0 0 0 10px color-mix(in srgb,var(--c) 40%,transparent)}
.rd .ce{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#3A474D}
.rd .rh{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,1.1rem + .8vw,2rem);line-height:1.12;text-wrap:balance;outline:none}
.rd .full{display:flex;flex-direction:column;gap:.8rem;font-size:1rem;line-height:1.55;color:#1E2A36}
.rd .full p,.rd .full ul,.rd .full ol{margin:0}
.rd .full ul,.rd .full ol{padding-left:1.2rem;display:flex;flex-direction:column;gap:.35rem}
.rd .full strong{font-weight:700}
.rd .intro{margin:-6px 0 0;font-size:1.02rem;line-height:1.5}
.rl2{display:flex;flex-direction:column;gap:12px;border-top:1px solid rgba(10,10,10,.12);padding-top:18px}
.rl2 h3{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#3A474D}
.rl2 .rg{display:flex;flex-direction:column;gap:4px}

var FULLD={"R01": "<p><strong>AI is very good at changing your mind.<\/strong> Last year, peer-reviewed studies found that a person’s political views could change more strongly after talking to a chatbot than by watching an ordinary campaign advert. AI is also being used by companies more and more to achieve their own goals: to get more attention, sell more products and sometimes even persuade people to see the world in ways that suit them.<\/p><p><strong>You’re also not very good at spotting when AI changes your point of view.<\/strong> Research has found that chatbots with built-in bias can shift opinions without users realising it — and that people often can’t spot adverts hidden in an AI’s answers.<\/p><p><strong>Political influence can also happen when nobody plans it.<\/strong> For example, a study on 24 different chatbots found that their answers to political questions were all quite similar, with no evidence that any bias was built-in intentionally.<\/p><p><strong>Currently, at least 1 major AI chatbot shows adverts.<\/strong> For now, these are kept separate from the answers, but experts are worried that paid messages, or a company’s preferred views could one day be mixed into the answers themselves. A wider worry — that AI could weaken the shared facts at the foundations of democracy — is emphasised in other risks on the map.<\/p>", "R02": "<p><strong>Public life often works by inviting people to write in:<\/strong> planning applications, government consultations, committee evidence, court &amp; legal filings, complaints, grant applications — the list goes on! A lot of this assumes that it takes some human-sized amount of effort to write a letter, so <strong>the pile of letters ought to stay roughly human-sized.<\/strong> However, because of AI, this assumption is no longer true and <strong>public processes and legal systems are at risk of disruption and manipulation.<\/strong><\/p><p><strong>Having the time and effort to write a letter may not be a fair barrier to public life in the first place.<\/strong> After all, it favours people who have time, money and employees. But it did make it harder for any one participant to flood the room. Now that AI can overcome this <strong>‘effort filter’<\/strong>, real people are using it to take part in public processes in ways they couldn’t before, but it could break systems which depend on the effort filter to function properly.<\/p><p>The US got a taste of this in June 2025, where an air quality board in California was deciding on whether to tighten rules on transitioning from gas heaters to electric ones. Just before the vote, they <strong>received over 20,000 emails from an ‘AI-powered grassroots advocacy platform’ opposing the motion<\/strong> and the board decided against passing the motion. However, many weeks later, most of the named senders were not available to respond to investigators, or the few who did respond knew little or nothing about the letters their names were attached to.<\/p>", "R03": "<p>Children increasingly are choosing to use AI tools for tutoring and mental health support over speaking with parents, teachers or friends. Some children form strong attachments to always-available, agreeable AI companions and can begin to prefer them to real relationships.<\/p><p>Social skills (like empathy and conflict resolution) are usually learnt through real human interactions, so as these AI systems enter children’s developing minds and daily environments, it can affect how kids relate to family and peers.<\/p>", "R05": "<p><strong>Before a powerful AI model is released to the public, testers attempt to check it for dangers.<\/strong> But unlike safety tests on things like cars &amp; aeroplanes, the companies creating AI get to decide for themselves who becomes a tester, how long they have to investigate and what permissions they are given.<\/p><p>This is because these companies — a tiny number of them, in the United States and China — are the only ones with the computing power, the data and the access that is needed to test whether it’s safe in the first place. The UK’s AI Security Institute has over 100 technical staff who can test models, but it currently relies on voluntary agreements with powerful US companies and ongoing goodwill — which can make it harder to publish findings the companies won’t like.<\/p><p>This risk is connected to a wider problem of AI companies concentrating economic power. This is covered under “AI companies too big to regulate”.<\/p>", "R06": "<p>Some AI companies release their models openly, so that anyone can download, run and change them. This has some benefits, as it means smaller researchers and organisations can study and build on them. <strong>But it also means the safety features can be removed.<\/strong> As open models catch up with the best closed ones, this now includes some of the most powerful AI systems ever developed.<\/p><p>These <strong>safety guardrails prevent<\/strong> you from using a model to make <strong>weapons of mass destruction<\/strong>, or launch <strong>cyberattacks<\/strong>, or to <strong>scam<\/strong> others and commit <strong>fraud<\/strong>, or fabricate <strong>deepfakes<\/strong>, or <strong>harm children<\/strong> or yourself. A study in 2024, however, showed that these guardrails can be undone for pennies’ worth of compute — and there are thousands of modified AI models on the internet available to download already.<\/p><p>The problem is that <strong>nobody is responsible for stopping this.<\/strong> Most AI laws give responsibilities to a company that builds a model and an organisation that uses it. Someone who makes cheap changes to a model and re-shares it falls outside these laws, and once a model is on someone else’s private computer, no company or government can see what it’s used for or take it back.<\/p>", "R07": "<p class=\"lede\">Many people want AI systems to be aligned with our intentions and under our control. There is a risk, however, that a model could cause harm and be difficult to switch off.<\/p><p>Right now, people can still follow how an AI model is reasoning and acting, and step in if needed. <strong>But as AI begins to be used to help build newer AI, it could improve faster than safety checks and regulators can keep up.<\/strong> In other words, by the time they decided to switch a model off, it may be too late.<\/p><p>AI builds AI by writing pieces of code, creating synthetic training data and suggesting improvements to software engineers. As this gets more involved, <strong>it can be difficult for engineers to track what’s changing and why<\/strong> — and without the ability to notice and respond, workers can’t oversee and control an AI’s activity.<\/p><p>Before publicly announcing the existence of a new model, AI companies use and test it themselves — and they don’t have to say what problems they find. In the UK, one public body does have the expertise to follow the behaviour of frontier AI models — the AI Security Institute — however <strong>it has no power to compel access.<\/strong> This is outlined in another risk in this cluster on the risk map.<\/p><p>This issue emphasises the limits in oversight and control of new AI models. A related scenario, about countries racing to use AI to build AI, and in the process developing a model which is misaligned with human intentions and wellbeing, was discussed by experts but did not make the final map of 13 risks.<\/p>", "R08": "<p>People are handing AI years of people’s personal data: searches, purchases, conversations, health and location information. This risks AI learning so much about a person that they can accurately model the trajectory of their life, including predicting their habits, weaknesses and future behaviour. This may give AI companies the ability to control citizens across the globe.<\/p>", "R09": "<p>The ability of AI to make sense of large amounts of military intelligence increases the risk that it is used to find the whereabouts of leaders, plan and simulate actions to go after them and then follow through on these plans with more precision and fewer casualties. In 2026, the US captured the leader of Venezuela and killed Iran’s Supreme Leader after AI tools were used to map his daily movements and help confirm his location. As this becomes easier, powerful people in government may put military might over laws or diplomacy.<\/p><p>The White House Deputy Chief of Staff for Policy and Homeland Security Advisor, Stephen Miller, said in January 2026:<\/p><blockquote><em>“We live in a world in which, you can talk about international niceties and everything else, but we live in a world, in the real world — that is governed by strength, that is governed by force, that is governed by power. These are the iron laws of the world since the beginning of time.”<\/em><\/blockquote><p><strong>The same capability is also used on people in urban warfare, at great volume.<\/strong> Throughout 2026, US forces have been using an AI-fused targeting system supplied by Palantir to help process up to 1,000 targets in a single day by combining satellite images, drone footage and human intelligence reports into targeting plans. On February 28, 2026, a strike planned using this system killed over 120 young girls in Shajareh, Iran — at a primary school wrongly connected to a nearby naval base.<\/p>", "R10": "<p>Countries have always competed to build more powerful military technology. Recent AI developments raise the risk of a runaway version of this, where agentic AI systems (those that act on their own) become a part of the command-and-control of large militaries.<\/p><p>This could lead to:<\/p><ol><li><strong>Automation.<\/strong> Someone asked to review a thousand AI-recommended targets at once may simply defer to the machine rather than check each one.<\/li><li><strong>Escalation.<\/strong> Countries could lose control of their militaries to unpredictable and flawed AI systems. If these systems aren’t explicitly programmed to seek peace and de-escalate conflicts, they could quickly trigger a catastrophic war.<\/li><li><strong>Unaccountability.<\/strong> Countries could get away with war crimes. Because international humanitarian law is written in terms of human intentions and clear chains of command, the picture gets muddied when life-or-death decisions are made across a system with plausible deniability.<\/li><\/ol>", "R11": "<p>AI has become so good at biology and chemistry that it can act like an expert lab assistant, giving thousands of people the knowledge of an elite, PhD-level scientist. This lowers the barrier to bad actors developing chemical &amp; biological weapons, including new viruses and toxins which could prove deadly in densely populated cities and places with limited public health systems.<\/p>", "R12": "<p>An AI model can be built in one country and used by people all over the world. <strong>If something goes wrong, the AI company can be far away and hard for local authorities to reach.<\/strong><\/p><p>Right now, most AI incidents come to light through news stories, social media posts and whistleblowers, not through any system built to spot them. Companies have little reason to volunteer bad news. <strong>Countries don’t agree on what counts as an AI incident<\/strong> and those with no AI safety body of their own may have <strong>no way to notice that something has gone wrong.<\/strong><\/p><p>There is no agreed system for countries to share and respond to incidents and no requirement for US companies to report misuse to the UK government. In September 2026, the US and China agreed to set up a channel to talk about AI incidents. The UK is not part of it, and no details have been published.<\/p><p>In June 2025, a US AI company banned a Canadian user’s account over violent activity, but did not tell the police, saying it saw no sign of an imminent attack. In February 2026, that person carried out a deadly attack. The company has since changed its rules on contacting police. The risk is that <strong>without agreed rules on who tells whom, governments only react after a disaster instead of preparing in advance.<\/strong><\/p>", "R14": "<p>The economy as a whole has come to rely on a small number of AI companies succeeding.<\/p><p>A small number of very big companies are carrying a lot of the economy on their backs. In the USA, the ten largest companies (mostly tech firms invested in AI) make up nearly 40% of the total value of the largest 500 companies. Investment in things like data centres accounted for about 92% of the growth in the US economy, despite being only about 4% of value, according to a Harvard economist.<\/p><p>These companies also fund each other, making demand for AI products look bigger than it might otherwise be. The Bank of England has warned that AI economic predictions may be inflated by these ‘circular’ deals.<\/p><p>When a handful of companies are essential to growth, governments want them to keep succeeding and are reluctant to restrict them. Any rule that might slow these companies down becomes costly to pass, and may affect the country’s overall economic performance. But if companies are ‘too big to fail’, they’re very hard to regulate.<\/p><p>As AI gets built into the workforce — into hospitals, courts, schools, transport and government services — the companies that control the essential building blocks of AI (AI models, advanced computer chips, special software, computing power, energy &amp; land) can set the terms everyone else must follow.<\/p><p>Unlike national infrastructure like water or electricity, AI companies are not required to keep prices controlled, serve wide groups of people and to supply their service even when it isn’t profitable to them.<\/p><p>The long-term risk is that a lasting arrangement is formed, where countries don’t learn to build their own AI, and instead keep renting it from a few companies forever more. But once a government is running its key institutions on AI that it rents from a company it doesn’t control, it may be giving away its power.<\/p>", "R15": "<p>As AI keeps giving useful advice and recommendations, people and institutions may move from trusting it → to relying on it → to depending on it completely, and in the process stop using human judgement to think things through fully themselves.<\/p><p>Many institutions, such as hospitals, courts and the armed forces, are now training people to use AI systems in their work, potentially risking their ability to reach a decision without it. Over time an institution may even lose the capacity to check the software which shapes AI analysis and recommendations, as fewer and fewer people within it remember another way.<\/p>"};

function mapSvg(){
 var t='',h='',s='';
 CLUSTERS.forEach(function(c){var m=MAP[c.id],col=CLCOL[c.id];
  c.risks.forEach(function(r,i){var a=m[2][i]*Math.PI/180,x=m[0]+31*Math.cos(a),y=m[1]+31*Math.sin(a),mx=m[0]+14*Math.cos(a+.35),my=m[1]+14*Math.sin(a+.35);
   t+='<path class="teth" stroke="'+col+'" d="M'+m[0]+' '+m[1]+' Q'+mx.toFixed(1)+' '+my.toFixed(1)+' '+x.toFixed(1)+' '+y.toFixed(1)+'"/>';
   s+='<circle class="drift" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="6.5" fill="'+col+'"/>';});
  h+='<circle class="drift" cx="'+m[0]+'" cy="'+m[1]+'" r="18" fill="'+col+'"/>';});
 /* frame the drawing on its own contents so it sits at the centre of the circle */
 var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 CLUSTERS.forEach(function(c){var m=MAP[c.id];x0=Math.min(x0,m[0]-18);x1=Math.max(x1,m[0]+18);y0=Math.min(y0,m[1]-18);y1=Math.max(y1,m[1]+18);
  m[2].forEach(function(d){var a=d*Math.PI/180,x=m[0]+31*Math.cos(a),y=m[1]+31*Math.sin(a);x0=Math.min(x0,x-6.5);x1=Math.max(x1,x+6.5);y0=Math.min(y0,y-6.5);y1=Math.max(y1,y+6.5);});});
 /* the circle is round, so fit the furthest circle edge from the centre, not the corners of a box */
 var mx0=(x0+x1)/2,my0=(y0+y1)/2,half=0;
 CLUSTERS.forEach(function(c){var m=MAP[c.id];half=Math.max(half,Math.hypot(m[0]-mx0,m[1]-my0)+18);
  m[2].forEach(function(d){var a=d*Math.PI/180;half=Math.max(half,Math.hypot(m[0]+31*Math.cos(a)-mx0,m[1]+31*Math.sin(a)-my0)+6.5);});});
 half+=3;
 var vb=(mx0-half).toFixed(1)+' '+(my0-half).toFixed(1)+' '+(2*half).toFixed(1)+' '+(2*half).toFixed(1);
 return '<svg class="map" viewBox="'+vb+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The risk map: 13 risks in 6 clusters">'+t+s+h+'</svg>';
}

 return '<svg class="ring" viewBox="0 0 200 200" aria-hidden="true">'+

}

/* =====================================================================================
   1. The poll: the risk map, the card that explains a circle, and the white panel
   ===================================================================================== */
/* where each cluster sits (share of the map), and the angle of each risk off it in degrees, 0 = east, 90 = south (from the Iceberg page) */
var PRE={
 W:{tg:.95,g:{voters:[.10,.03,[15,105]],check:[.90,.06,[175,125,80]],data:[.50,.40,[-100,30]],war:[.05,.60,[-35,25,95]],kids:[.40,.97,[-40,190]],work:[.94,.80,[200]]}},
 P:{tg:.62,g:{voters:[0,0,[25,100]],check:[1,.10,[195,150,95]],war:[.08,.47,[-30,25,95]],data:[.92,.55,[205,110]],kids:[.10,1,[-15,-100]],work:[.90,1,[-140]]}}
};
function rnd(i){var x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function f1(v){return v.toFixed(1);}
var MN={hubs:[],sats:[],hub:{},sat:{}};
var CARD=null,HIDET=null,POINTERING=false,LASTPT='',PT=null;
function buildMap(){
 var nodes=$('nodes'),teth=$('teth'),pi=0;
 CLUSTERS.forEach(function(c){
  var b=document.createElement('button');b.type='button';b.className='mh';b.setAttribute('data-c',c.id);b.style.setProperty('--c',HUE[c.id]);
  b.innerHTML='<span class="hn" data-copy="cluster.'+c.id+'">'+rich('cluster.'+c.id)+'</span><span class="badge" aria-hidden="true">'+TICK+'</span>';
  nodes.appendChild(b);
  var H={kind:'c',id:c.id,c:c,el:b,x:0,y:0,r:40};MN.hubs.push(H);MN.hub[c.id]=H;wire(H);
  c.risks.forEach(function(r){
   var i=pi++;
   var s=document.createElement('button');s.type='button';s.className='ms';s.setAttribute('data-c',c.id);s.setAttribute('data-r',r);s.style.setProperty('--c',HUE[c.id]);s.innerHTML=TICK;
   nodes.appendChild(s);
   var p=document.createElementNS('http://www.w3.org/2000/svg','path');p.style.setProperty('--c',HUE[c.id]);teth.appendChild(p);
   var q={kind:'r',id:r,c:c,h:H,el:s,path:p,x:0,y:0,r:12,dist:0,o1:(rnd(i+31)-.5)*.62,o2:(rnd(i+57)-.5)*.8,k1:.3+rnd(i+71)*.22,k2:.26+rnd(i+83)*.22};
   MN.sats.push(q);MN.sat[r]=q;wire(q);
  });
 });
}
function paintMapText(){
 var hw=$('mhow'),k=reading()?(FINE?'read.how':'read.howt'):(FINE?'poll.how':'poll.howt');hw.setAttribute('data-copy',k);hw.innerHTML=rich(k);
 $('pmap').setAttribute('aria-label',plain('map.cap'));
 var show=shown();
 MN.hubs.forEach(function(H){var on=show.clusters.indexOf(H.id)>=0;H.el.setAttribute('aria-label',plain('cluster.'+H.id)+(on?'. '+plain('card.on'):''));});
 MN.sats.forEach(function(q){var on=show.risks.indexOf(q.id)>=0;q.el.setAttribute('aria-label',plain('risk.'+q.id)+'. '+plain('riskd.'+q.id)+(on?' '+plain('card.on')+'.':''));});
}
/* lay the clusters out over the map, below its caption, then nudge them apart (as on the Iceberg page) */
function layoutMap(){
 var pm=$('pmap'),W=pm.clientWidth,H=pm.clientHeight;if(!W||!H)return;
 var cap=$('mcap'),top=cap.offsetTop+cap.offsetHeight+4;
 var reg={x:0,y:top,w:W,h:Math.max(200,H-top)};
 var P=reg.w/reg.h<.8?PRE.P:PRE.W;
 var Rh=clamp(.2*Math.sqrt(reg.w*reg.h/6),W<600?44:40,118),marg=clamp(Rh*.3,12,30);
 var x0=reg.x+marg+Rh,y0=reg.y+marg+Rh,W0=Math.max(1,reg.w-2*(marg+Rh)),H0=Math.max(1,reg.h-2*(marg+Rh));
 MN.hubs.forEach(function(Hb){
  var a=P.g[Hb.id];Hb.x=x0+a[0]*W0;Hb.y=y0+a[1]*H0;Hb.r=Rh;
  Hb.c.risks.forEach(function(r,i){var q=MN.sat[r],ang=a[2][i]*Math.PI/180;
   q.r=Math.max(13,Rh*.3);q.dist=Rh+P.tg*Rh+q.r;q.x=Hb.x+q.dist*Math.cos(ang);q.y=Hb.y+q.dist*Math.sin(ang);});
 });
 relax(reg,Rh,marg);
 var t=$('teth');t.setAttribute('width',W);t.setAttribute('height',H);
 MN.hubs.forEach(function(Hb){var e=Hb.el;e.style.width=e.style.height=f1(2*Hb.r)+'px';e.style.transform='translate('+f1(Hb.x-Hb.r)+'px,'+f1(Hb.y-Hb.r)+'px)';e.style.setProperty('--hf',f1(clamp(Hb.r*.235,12,27))+'px');});
 MN.sats.forEach(function(q){var e=q.el;e.style.width=e.style.height=f1(2*q.r)+'px';e.style.transform='translate('+f1(q.x-q.r)+'px,'+f1(q.y-q.r)+'px)';q.path.setAttribute('d',tpath(q.h,q));});
 if(CARD&&!$('card').hidden)placeCard();
}
function relax(reg,Rh,marg){
 var N=[];
 MN.hubs.forEach(function(Hb){N.push({o:Hb,hub:1,g:Hb.id,r:Hb.r});});
 MN.sats.forEach(function(q){N.push({o:q,hub:0,g:q.c.id,r:q.r*1.2});});
 for(var it=0;it<240;it++){
  for(var i=0;i<N.length;i++)for(var j=i+1;j<N.length;j++){
   var a=N[i],b=N[j];
   if(a.g===b.g&&(a.hub||b.hub))continue;
   var gap=(a.hub&&b.hub)?Rh*.55:((a.hub||b.hub)?18:(a.g===b.g?12:16));
   var dx=b.o.x-a.o.x,dy=b.o.y-a.o.y,d=Math.sqrt(dx*dx+dy*dy)||.01,min=a.r+b.r+gap;
   if(d<min){var wa=a.hub?.25:1,wb=b.hub?.25:1,s=wa+wb,push=min-d,ux=dx/d,uy=dy/d;
    a.o.x-=ux*push*wa/s;a.o.y-=uy*push*wa/s;b.o.x+=ux*push*wb/s;b.o.y+=uy*push*wb/s;}
  }
  MN.sats.forEach(function(q){var dx=q.x-q.h.x,dy=q.y-q.h.y,d=Math.sqrt(dx*dx+dy*dy)||1,k=(q.dist-d)/d*.6;q.x+=dx*k;q.y+=dy*k;});
  N.forEach(function(nd){nd.o.x=clamp(nd.o.x,reg.x+marg+nd.r,reg.x+reg.w-marg-nd.r);nd.o.y=clamp(nd.o.y,reg.y+marg+nd.r,reg.y+reg.h-marg-nd.r);});
 }
}
/* a curved tether from a cluster to one of its risks */
function tpath(Hb,q){
 var dx=q.x-Hb.x,dy=q.y-Hb.y,a=Math.atan2(dy,dx),a1=a+q.o1,a2=a+Math.PI+q.o2;
 var p0x=Hb.x+Hb.r*Math.cos(a1),p0y=Hb.y+Hb.r*Math.sin(a1),p3x=q.x+q.r*Math.cos(a2),p3y=q.y+q.r*Math.sin(a2);
 var L=Math.sqrt((p3x-p0x)*(p3x-p0x)+(p3y-p0y)*(p3y-p0y));
 return 'M'+f1(p0x)+' '+f1(p0y)+'C'+f1(p0x+Math.cos(a1)*L*q.k1)+' '+f1(p0y+Math.sin(a1)*L*q.k1)+' '+f1(p3x+Math.cos(a2)*L*q.k2)+' '+f1(p3y+Math.sin(a2)*L*q.k2)+' '+f1(p3x)+' '+f1(p3y);
}

/* pointing reads, clicking chooses; on a touch screen the first tap reads and a second tap (or the card's button) chooses */
function wire(nd){
 var e=nd.el;
 e.addEventListener('pointerdown',function(ev){POINTERING=true;LASTPT=ev.pointerType;clearTimeout(PT);PT=setTimeout(function(){POINTERING=false;},700);});
 e.addEventListener('pointerenter',function(ev){if(ev.pointerType==='mouse')showCard(nd,false);});
 e.addEventListener('pointerleave',function(ev){if(ev.pointerType==='mouse')hideSoon();});
 e.addEventListener('focus',function(){if(!POINTERING)showCard(nd,false);});
 e.addEventListener('blur',function(){hideSoon();});
 e.addEventListener('click',function(){
  var touch=LASTPT==='touch'||LASTPT==='pen';LASTPT='';POINTERING=false;
  if(document.documentElement.classList.contains('editmode')){showCard(nd,true);return;}
  if(reading()){readPick(nd);return;}
  var open=CARD&&CARD.n===nd&&!$('card').hidden;
  if(touch&&!open){showCard(nd,true);return;}
  showCard(nd,touch);toggle(nd);
 });
}
function chosenIn(nd,src){return (nd.kind==='c'?src.clusters:src.risks).indexOf(nd.id)>=0;}
function shown(){if(reading())return {clusters:[],risks:[]};return MODE==='thanks'&&SENT?SENT:F;}
function showCard(nd,pinned){clearTimeout(HIDET);CARD={n:nd,pinned:!!pinned};fillCard();placeCard();hotMap(nd.c.id,nd.kind==='r'?nd.id:null);}
function fillCard(){
 var nd=CARD.n,c=$('card'),h='';
 if(nd.kind==='r'){
  h='<span class="ce" style="--c:'+HUE[nd.c.id]+'"><i class="dot"></i>'+esc(plain('cluster.'+nd.c.id))+'</span><h3>'+esc(plain('risk.'+nd.id))+'</h3>'+T('p','riskd.'+nd.id);
 }else{
  h='<span class="ce" style="--c:'+HUE[nd.id]+'"><i class="dot"></i>'+T('span','card.cl')+'</span><h3>'+esc(plain('cluster.'+nd.id))+'</h3>'+T('p','card.inc')+
   '<ul>'+nd.c.risks.map(function(r){return '<li style="--c:'+HUE[nd.id]+'"><i class="dot"></i><span>'+esc(plain('risk.'+r))+'</span></li>';}).join('')+'</ul>';
 }
 h+='<div class="ca">'+cardAction(nd)+'</div><button type="button" class="cx" id="cx" aria-label="'+esc(plain('card.close'))+'">'+XSVG+'</button>';
 c.innerHTML=h;c.classList.toggle('peek',!CARD.pinned);c.setAttribute('aria-label',nd.kind==='r'?plain('risk.'+nd.id):plain('cluster.'+nd.id));
 var b=c.querySelector('[data-act="t"]');if(b)b.addEventListener('click',function(){toggle(nd);if(CARD)CARD.pinned=true;});
 $('cx').addEventListener('click',hideCard);
}
function cardAction(nd){
 if(reading())return T('p','read.more','ch');
 if(MODE==='thanks')return chosenIn(nd,shown())?'<span class="cs">'+TICK+T('span','card.mine')+'</span>':'';
 if(!CARD.pinned){
  if(chosenIn(nd,F))return '<p class="ch">'+TICK+T('span','card.clickoff')+'</p>';
  if((nd.kind==='c'?F.clusters:F.risks).length>=2)return T('p','poll.max','cn');
  return T('p','card.click','ch');
 }
 if(chosenIn(nd,F))return '<span class="cs">'+TICK+T('span','card.on')+'</span><button type="button" class="cb lite" data-act="t">'+T('span','card.off')+'</button>';
 if((nd.kind==='c'?F.clusters:F.risks).length>=2)return T('p','poll.max','cn');
 return '<button type="button" class="cb" data-act="t">'+T('span',nd.kind==='r'?'card.pickr':'card.pickc')+'</button>';
}
function placeCard(){
 var c=$('card'),pm=$('pmap'),nd=CARD.n,W=pm.clientWidth,H=pm.clientHeight;
 c.hidden=false;
 if(W<640){c.classList.add('dock');c.classList.toggle('dtop',nd.y>H*.52);c.style.left='';c.style.top='';return;}
 c.classList.remove('dock','dtop');
 var cw=c.offsetWidth,ch=c.offsetHeight,gap=18,x=nd.x+nd.r+gap;
 if(x+cw>W-12)x=nd.x-nd.r-gap-cw;
 x=clamp(x,12,W-cw-12);
 c.style.left=f1(x)+'px';c.style.top=f1(clamp(nd.y-ch/2,12,H-ch-12))+'px';
}
function hideSoon(){clearTimeout(HIDET);HIDET=setTimeout(function(){
 var c=$('card');if(!CARD||CARD.pinned)return;
 if(c.matches(':hover')||c.contains(document.activeElement))return;
 if(document.activeElement===CARD.n.el)return;
 hideCard();},260);}
function hideCard(){clearTimeout(HIDET);CARD=null;$('card').hidden=true;hotMap(null,null);}
function hotMap(cid,rid){
 var pm=$('pmap');if(cid)pm.setAttribute('data-hot',cid);else pm.removeAttribute('data-hot');
 MN.hubs.forEach(function(Hb){Hb.el.classList.toggle('hot',Hb.id===cid);});
 MN.sats.forEach(function(q){q.el.classList.toggle('hot',q.c.id===cid);q.el.classList.toggle('aim',!!rid&&q.id===rid);q.path.classList.toggle('hot',q.c.id===cid);});
}
(function(){
 var c=$('card');
 c.addEventListener('pointerenter',function(){clearTimeout(HIDET);});
 c.addEventListener('pointerleave',function(ev){if(ev.pointerType==='mouse')hideSoon();});
 c.addEventListener('focusout',function(){hideSoon();});
 document.addEventListener('click',function(ev){
  if(!CARD||$('card').hidden)return;var t=ev.target;
  if(t.closest&&(t.closest('#card')||t.closest('.mh')||t.closest('.ms')||t.closest('#ed')))return;
  hideCard();
 });
})();

/* choosing: at most two clusters and two risks */
function toggle(nd){
 if(MODE!=='form')return;
 var kind=nd.kind,arr=kind==='c'?F.clusters:F.risks,i=arr.indexOf(nd.id);
 if(i>=0)arr.splice(i,1);
 else{if(arr.length>=2){showMax(kind);if(CARD)fillCard();return false;}arr.push(nd.id);}
 clearErr();syncUI();return true;
}
var MAXT={};
function showMax(kind){var m=$(kind==='c'?'maxc':'maxr');if(!m)return;m.setAttribute('data-copy','poll.max');m.innerHTML=rich('poll.max');m.hidden=false;clearTimeout(MAXT[kind]);MAXT[kind]=setTimeout(function(){m.hidden=true;},5000);}
function syncUI(){
 var full={c:F.clusters.length>=2,r:F.risks.length>=2};
 document.querySelectorAll('#side .opt').forEach(function(o){
  var k=o.getAttribute('data-k'),id=o.getAttribute('data-id'),on=(k==='c'?F.clusters:F.risks).indexOf(id)>=0;
  o.classList.toggle('on',on);o.classList.toggle('full',full[k]&&!on);var i=o.querySelector('input');if(i)i.checked=on;
 });
 var show=shown();
 MN.hubs.forEach(function(Hb){var on=show.clusters.indexOf(Hb.id)>=0;Hb.el.classList.toggle('on',on);Hb.el.setAttribute('aria-pressed',String(on));});
 MN.sats.forEach(function(q){var on=show.risks.indexOf(q.id)>=0;q.el.classList.toggle('on',on);q.el.setAttribute('aria-pressed',String(on));});
 paintMapText();
 if(CARD&&!$('card').hidden){fillCard();placeCard();}
}

/* the white panel: the form, or a thank-you once sent */
function opt(kind,id){
 var cid=kind==='c'?id:CLOF[id];
 return '<label class="opt" style="--c:'+HUE[cid]+'" data-k="'+kind+'" data-id="'+id+'"><input type="checkbox" name="'+(kind==='c'?'clusters':'risks')+'" value="'+id+'">'+
  '<i class="dot" aria-hidden="true"></i>'+T('span',(kind==='c'?'cluster.':'risk.')+id)+'</label>';
}
function sumList(kind,ids){
 return '<ul>'+ids.map(function(id){var cid=kind==='c'?id:CLOF[id];return '<li style="--c:'+HUE[cid]+'"><i class="dot" aria-hidden="true"></i>'+T('span',(kind==='c'?'cluster.':'risk.')+id)+'</li>';}).join('')+'</ul>';
}
function renderPanel(){

 if(reading()){renderRead();return;}
 if(MODE==='thanks'&&SENT){
  h='<div class="sbody thanks" id="sbody"><span class="tkbig" aria-hidden="true">'+TICK+'</span>'+

   '<div class="sum">'+T('h3','thanks.yc')+sumList('c',SENT.clusters)+T('h3','thanks.yr')+sumList('r',SENT.risks)+'</div>'+
   (DB?'':'<p class="note">'+INFO+T('span','poll.preview')+'</p>')+
   '</div><div class="sfoot"><button type="button" class="send" id="explore">'+T('span','thanks.go')+ARROW+'</button>'+
   '<button type="button" class="lnk" id="change">'+T('span','thanks.change')+'</button></div>';

 }else{

   '<div class="fld"><label class="ql" for="pname">'+T('span','poll.name')+'</label><input id="pname" type="text" autocomplete="given-name" maxlength="60" value="'+esc(F.name)+'"></div>'+
   '<fieldset class="fld" id="fsc"><legend class="ql">'+T('span','poll.cq')+'</legend>'+T('p','poll.up2','qh')+'<div class="opts">'+co+'</div><p class="max" id="maxc" role="status" hidden></p></fieldset>'+
   '<fieldset class="fld" id="fsr"><legend class="ql">'+T('span','poll.rq')+'</legend>'+T('p','poll.up2','qh')+'<div class="opts">'+ro+'</div><p class="max" id="maxr" role="status" hidden></p></fieldset>'+
   '<button type="button" class="skip2" id="skip">'+T('span','poll.skip')+'</button>'+
   '</div><div class="sfoot"><p class="err" id="perr" role="alert" hidden></p>'+
   '<div class="sbtns"><button type="button" class="send" id="send">'+TICK+'<span data-copy="'+(SENDING?'poll.sending':'poll.send')+'">'+rich(SENDING?'poll.sending':'poll.send')+'</span></button>'+
   '<button type="button" class="chosen" id="chosen">'+T('span','poll.chosen')+'</button></div></div>';
  s.innerHTML=h;
  $('pname').addEventListener('input',function(){F.name=this.value;clearErr();});

}
document.addEventListener('click',function(e){
 if(!CAN||!EDITMODE)return;var t=e.target;if(!t.closest||t.closest('#ed,#edbar'))return;
 var nd=t.closest('[data-copy]');if(!nd){if(t.closest('a'))e.preventDefault();return;}
 e.preventDefault();e.stopPropagation();openEditor(nd);
},true);
document.addEventListener('mousedown',function(e){if(!$('ed').hidden&&!e.target.closest('#ed'))commitEditor(false);},true);
$('edta').addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();closeEditor();}else if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commitEditor(false);}});
$('edsave').addEventListener('click',function(){commitEditor(false);});
$('edcancel').addEventListener('click',closeEditor);
$('edreset').addEventListener('click',function(){commitEditor(true);});
$('edtoggle').addEventListener('click',function(){EDITMODE=!EDITMODE;try{sessionStorage.setItem('hotp-hub-edit',EDITMODE?'1':'');}catch(e){}applyCan();});
window.addEventListener('beforeunload',function(e){if(saveTimer){e.preventDefault();e.returnValue='';}});
if(window.claude&&window.claude.use){
 window.claude.use('artifact').then(function(a){if(!a)return;ARTF=a;
  return window.claude.use('user').then(function(u){return u?u.canEdit():true;},function(){return true;}).then(function(ok){CAN=!!ok;applyCan();});
 }).catch(function(){});
}
})();
</script>
